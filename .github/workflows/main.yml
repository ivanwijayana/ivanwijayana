name: Update Profile README
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *' 
  workflow_dispatch: 

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      # 1. Update Daftar Repo (Pake Library yang Pasti Ada & Stabil)
      - name: Update Recent Repositories
        uses: pankaj2884/recent-repositories@v1.4
        with:
          token: ${{ github.token }}
          count: 5
          template: "- [$name]($url) - $description"

      # 2. Update Daftar Commit (Pake Feed Atom Kamu)
      - name: Update Recent Commits
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "LAST_COMMIT"
          feed_list: "https://github.com/ivanwijayana.atom"
          max_post_count: 5
          template: "- $title ($date)"
