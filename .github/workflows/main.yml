name: Update Profile README
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *' 
  workflow_dispatch: 

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # PENTING: Biar Action bisa nulis ke README
    steps:
      - uses: actions/checkout@v3

      # 1. Update Daftar Repo (Pake repo yang benar: recent-repositories)
      - uses: gautamkrishnar/recent-repositories@v1.5.0
        with:
          token: ${{ github.token }}
          count: 5
          sort: 'updated'
          template: "- [$name]($url) - $description"

      # 2. Update Daftar Commit
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "LAST_COMMIT"
          feed_list: "https://github.com/ivanwijayana.atom"
          max_post_count: 5
          template: "- $title ($date)"
